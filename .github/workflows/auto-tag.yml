# Derive the next semver tag from conventional commits since the last tag,
# then push it. The Release workflow picks it up and builds the artifacts.
name: Auto Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and push next version tag
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)

          # No previous tag → start at v0.1.0
          if [ -z "$LAST_TAG" ]; then
            TAG=v0.1.0
          else
            # HEAD already tagged → nothing to do
            if [ "$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
              echo "HEAD already tagged at $LAST_TAG — nothing to do"
              exit 0
            fi

            COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%s%n%b")

            # Bump logic: breaking > feat > patch
            MAJOR=0; MINOR=0
            if echo "$COMMITS" | grep -qsE "BREAKING[ -]CHANGE"; then
              MAJOR=1
            elif echo "$COMMITS" | grep -qsE '^[a-z]+(\(.+\))?!:'; then
              MAJOR=1
            elif echo "$COMMITS" | grep -qsE '^feat(\(.+\))?:'; then
              MINOR=1
            fi

            IFS=. read -r MAJOR_V MINOR_V PATCH_V <<< "${LAST_TAG#v}"
            : "${PATCH_V:=0}"

            if [ "$MAJOR" -eq 1 ]; then
              TAG="v$((MAJOR_V + 1)).0.0"
            elif [ "$MINOR" -eq 1 ]; then
              TAG="v${MAJOR_V}.$((MINOR_V + 1)).0"
            else
              TAG="v${MAJOR_V}.${MINOR_V}.$((PATCH_V + 1))"
            fi
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG" -m "$TAG"
          git push origin "$TAG" || echo "Tag $TAG already exists remotely — OK"
          echo "Pushed tag $TAG"
