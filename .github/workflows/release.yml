# Push a tag like v1.2 and a GitHub Release appears with Tack.app attached,
# one zip per architecture (Apple Silicon and Intel).
# Ad-hoc signed (no identity in CI): downloaders right-click → Open the first time.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15 # Sequoia, pinned — macos-latest drifts to whatever GitHub promotes next
    steps:
      - uses: actions/checkout@v4

      # bundle.sh rebuilds Tack.app from scratch each run, so build+zip per arch in sequence.
      # ditto keeps the bundle's structure and metadata intact.
      - name: Build Tack.app (Apple Silicon)
        run: |
          BUILD_FLAGS="--arch arm64" SIGN_ID=- ./bundle.sh
          ditto -c -k --keepParent Tack.app "Tack-$GITHUB_REF_NAME-apple-silicon.zip"

      - name: Build Tack.app (Intel)
        run: |
          BUILD_FLAGS="--arch x86_64" SIGN_ID=- ./bundle.sh
          ditto -c -k --keepParent Tack.app "Tack-$GITHUB_REF_NAME-intel.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Tack-$GITHUB_REF_NAME-apple-silicon.zip" \
            "Tack-$GITHUB_REF_NAME-intel.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**apple-silicon** for M-series Macs, **intel** for Intel Macs. Unzip, then **right-click → Open** on first launch (the build is not notarized)."
