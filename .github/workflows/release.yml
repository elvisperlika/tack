# Push a tag like v1.2 and a GitHub Release appears with Tack.app attached.
# Ad-hoc signed (no identity in CI): downloaders right-click → Open the first time.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15  # Sequoia, pinned — macos-latest drifts to whatever GitHub promotes next
    steps:
      - uses: actions/checkout@v4

      - name: Build Tack.app
        run: SIGN_ID=- ./bundle.sh

      - name: Zip the app # ditto keeps the bundle's structure and metadata intact
        run: ditto -c -k --keepParent Tack.app "Tack-$GITHUB_REF_NAME.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Tack-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Unzip, then **right-click → Open** on first launch (the build is not notarized)."
