# Push to main → the next semver tag is derived from the conventional commits since
# the last tag, pushed, and a GitHub Release appears with Tack.app attached,
# one zip per architecture (Apple Silicon and Intel).
# One workflow on purpose: a tag pushed with GITHUB_TOKEN does not trigger other
# workflows, so the build has to hang off the same run that created the tag.
# Signed with the Tack Release certificate, not notarized: downloaders right-click → Open the first time.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and push next version tag
        id: bump
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)

          # No previous tag → start at v0.1.0
          if [ -z "$LAST_TAG" ]; then
            TAG=v0.1.0
          else
            # HEAD already tagged → nothing to do (empty output skips the build jobs)
            if [ "$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
              echo "HEAD already tagged at $LAST_TAG — nothing to do"
              exit 0
            fi

            COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%s%n%b")

            # Bump logic: breaking > feat > patch
            MAJOR=0; MINOR=0
            if echo "$COMMITS" | grep -qsE "BREAKING[ -]CHANGE"; then
              MAJOR=1
            elif echo "$COMMITS" | grep -qsE '^[a-z]+(\(.+\))?!:'; then
              MAJOR=1
            elif echo "$COMMITS" | grep -qsE '^feat(\(.+\))?:'; then
              MINOR=1
            fi

            IFS=. read -r MAJOR_V MINOR_V PATCH_V <<< "${LAST_TAG#v}"
            : "${PATCH_V:=0}"

            if [ "$MAJOR" -eq 1 ]; then
              TAG="v$((MAJOR_V + 1)).0.0"
            elif [ "$MINOR" -eq 1 ]; then
              TAG="v${MAJOR_V}.$((MINOR_V + 1)).0"
            else
              TAG="v${MAJOR_V}.${MINOR_V}.$((PATCH_V + 1))"
            fi
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pushed tag $TAG"

  # One runner per arch: Apple Silicon builds native on macos-latest; Intel is pinned to macos-15
  # so the x86_64 cross-build stays on a known-good runner as GitHub promotes newer images.
  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
            runner: macos-latest
          - arch: x86_64
            label: intel
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      # One certificate signs every release, so macOS keeps Tack's Accessibility and Automation
      # grants across updates instead of asking again each time. Made once with
      # scripts/make-signing-cert.sh.
      # Without the secrets the build fails rather than signing ad-hoc: an ad-hoc signature changes with every build, so each update would quietly cost every user those grants.
      - name: Import signing certificate
        id: cert
        env:
          P12: ${{ secrets.TACK_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.TACK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::TACK_SIGNING_P12 / TACK_SIGNING_PASSWORD are not set. Run scripts/make-signing-cert.sh and add both secrets."
            exit 1
          fi
          KC="$RUNNER_TEMP/tack-signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"   # no auto-lock mid-build
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/tack.p12"
          security import "$RUNNER_TEMP/tack.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          rm "$RUNNER_TEMP/tack.p12"
          # codesign refuses an identity macOS doesn't trust for code signing, and a self-signed
          # certificate is trusted only once it is told to be.
          security find-certificate -c "Tack Release" -p "$KC" > "$RUNNER_TEMP/tack.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/tack.pem"
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/"Tack Release"/ {print $2; exit}')
          [ -n "$ID" ] || { echo "Tack Release identity not usable for code signing" >&2; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"

      # bundle.sh rebuilds Tack.app from scratch; ditto keeps the bundle's structure/metadata intact.
      - name: Build Tack.app (${{ matrix.label }})
        env:
          SIGN_ID: ${{ steps.cert.outputs.id }}
          SIGN_KEYCHAIN: ${{ steps.cert.outputs.keychain }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          BUILD_FLAGS="--arch ${{ matrix.arch }}" VERSION="${TAG#v}" ./bundle.sh
          ditto -c -k --keepParent Tack.app "Tack-${{ needs.tag.outputs.tag }}-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Tack-${{ matrix.label }}
          path: "Tack-*-${{ matrix.label }}.zip"

  # Both zips in hand, cut the release once (a Linux runner is enough — no macOS work here).
  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/Tack-$TAG-apple-silicon.zip" \
            "dist/Tack-$TAG-intel.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --notes "**apple-silicon** for M-series Macs, **intel** for Intel Macs. Unzip, then **right-click → Open** on first launch (the build is not notarized)."
